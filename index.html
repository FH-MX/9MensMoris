<!DOCTYPE html>
<html lang="ja">
<head>
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <!-- ↓ descriptionを具体的に書き直す -->
  <meta name="description" content="9 Men's Morris（ナインメンズモリス）をFlutterで実装したWebゲームです。2人対戦またはCPU対戦で遊べます。">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="9 Men's Morris">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>

  <!-- ↓ titleも変更 -->
  <title>9 Men's Morris - 無料ボードゲーム</title>
  <link rel="manifest" href="manifest.json">

  <script
    async
    src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6888437414541905"
    crossorigin="anonymous">
  </script>

  <style>
    body {
      margin: 0;
      background: #faf7f2;
    }

    #app-loading {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: #faf7f2;
      color: #2f2a22;
      font-family: sans-serif;
      text-align: center;
    }

    #app-loading strong {
      display: block;
      margin-bottom: 8px;
      font-size: 1.25rem;
    }

    #game-info {
      max-width: 800px;
      margin: 0 auto;
      padding: 12px 16px;
      font-family: sans-serif;
    }
    #game-info h1 { font-size: 1.4rem; margin-bottom: 8px; }
    #game-info p  { font-size: 0.95rem; line-height: 1.6; }
  </style>

  <noscript>
    <style>
      #app-loading {
        display: none;
      }
    </style>
  </noscript>
</head>
<body>
  <div id="app-loading">
    <div>
      <strong>9 Men's Morris</strong>
      <span>ゲームを読み込んでいます...</span>
    </div>
  </div>

  <!-- ↓ Googleが読めるコンテンツをここに追加 -->
  <div id="game-info">
    <h1>9 Men's Morris（ナインメンズモリス）</h1>
    <p>
      ヨーロッパ発祥の古典ボードゲームをFlutterで実装しました。
      盤上に駒を配置し、縦・横に3つ並べると相手の駒を取れます。
      相手の駒を2個以下にするか、動けなくすれば勝利です。
    </p>
    <p>
      Phase 1（配置）→ Phase 2（移動）→ Phase 3（飛び移り）の
      3フェーズで進行する本格ルール対応です。
    </p>
    <p>
      <a href="https://fh-mx.github.io/privacy.html">
        プライバシーポリシー
      </a>
    </p>
  </div>
  <!-- ↑ ここまでがGoogleに見えるコンテンツ -->

  <script>
    window.addEventListener('flutter-first-frame', function () {
      const loading = document.getElementById('app-loading');
      if (loading) {
        loading.remove();
      }
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
